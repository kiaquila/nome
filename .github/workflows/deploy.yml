name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy from main history
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SSH_CONNECT_TIMEOUT_SECONDS: "30"
  SSH_EXECUTION_TIMEOUT_SECONDS: "1200"

permissions:
  contents: read

concurrency:
  group: nome-deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout release revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Validate release revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The selected revision is not in main history." >&2
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_HOST:?Set the DEPLOY_SSH_HOST repository secret}"
          : "${DEPLOY_SSH_USER:?Set the DEPLOY_SSH_USER repository secret}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set the DEPLOY_SSH_PRIVATE_KEY repository secret}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Set the DEPLOY_SSH_KNOWN_HOSTS repository secret}"
          : "${DEPLOY_TARGET_DIR:?Set the DEPLOY_TARGET_DIR repository secret}"
          DEPLOY_SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          if ! [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_SSH_PORT must be numeric." >&2
            exit 1
          fi

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "archive=$RUNNER_TEMP/nome-release.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output "${{ steps.release.outputs.archive }}" HEAD

      - name: Configure SSH
        id: ssh
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DEPLOY_SSH_HOST"
          echo "::add-mask::$DEPLOY_SSH_USER"

          ssh_dir="$RUNNER_TEMP/ssh"
          key_path="$ssh_dir/deploy_key"
          known_hosts_path="$ssh_dir/known_hosts"
          config_path="$ssh_dir/config"

          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_path"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"

          cat > "$config_path" <<EOF
          Host nome-production
            HostName ${DEPLOY_SSH_HOST}
            User ${DEPLOY_SSH_USER}
            Port ${DEPLOY_SSH_PORT:-22}
            IdentityFile ${key_path}
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${known_hosts_path}
            ConnectTimeout ${SSH_CONNECT_TIMEOUT_SECONDS}
            LogLevel ERROR
          EOF

          chmod 600 "$config_path"
          echo "config=$config_path" >> "$GITHUB_OUTPUT"

      - name: Transfer release archive
        id: transfer
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          remote_archive="/tmp/nome-release-${RELEASE_SHA}.tar.gz"
          timeout "$SSH_EXECUTION_TIMEOUT_SECONDS" \
            scp -F "${{ steps.ssh.outputs.config }}" -q \
            "${{ steps.release.outputs.archive }}" "nome-production:${remote_archive}"
          echo "remote_archive=$remote_archive" >> "$GITHUB_OUTPUT"

      - name: Run production deploy
        shell: bash
        env:
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
          DEPLOY_SERVICE_USER: ${{ secrets.DEPLOY_SERVICE_USER }}
          DEPLOY_SERVICE_GROUP: ${{ secrets.DEPLOY_SERVICE_GROUP }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REMOTE_ARCHIVE: ${{ steps.transfer.outputs.remote_archive }}
        run: |
          set -euo pipefail
          service_user="${DEPLOY_SERVICE_USER:-ubuntu}"
          service_group="${DEPLOY_SERVICE_GROUP:-$service_user}"

          cat > "$RUNNER_TEMP/remote-deploy.sh" <<'EOF'
          set -euo pipefail

          if [[ "$REMOTE_ARCHIVE" != /tmp/nome-release-*.tar.gz ]]; then
            echo "Refusing unexpected remote archive path." >&2
            exit 1
          fi

          bootstrap_script="/tmp/nome-deploy-bootstrap-${RELEASE_SHA}.sh"
          cleanup() {
            rm -f "$REMOTE_ARCHIVE"
            rm -f "$bootstrap_script"
          }
          trap cleanup EXIT

          cat > "$bootstrap_script" <<'BOOTSTRAP'
          set -euo pipefail

          tmp_dir="$(mktemp -d "/tmp/nome-deploy-${RELEASE_SHA}.XXXXXX")"
          release_dir="${tmp_dir}/release"

          cleanup_release() {
            rm -rf "$tmp_dir"
          }
          trap cleanup_release EXIT

          mkdir -p "$release_dir"
          tar -xzf "$REMOTE_ARCHIVE" -C "$release_dir"
          chmod +x "$release_dir/scripts/deploy_release.sh"

          deploy_command=(
            env
            "TARGET_DIR=$DEPLOY_TARGET_DIR"
            "RELEASE_SHA=$RELEASE_SHA"
            "RELEASE_SOURCE_DIR=$release_dir"
            "SERVICE_USER=$SERVICE_USER"
            "SERVICE_GROUP=$SERVICE_GROUP"
            bash "$release_dir/scripts/deploy_release.sh"
          )

          "${deploy_command[@]}"
          BOOTSTRAP

          chmod 0755 "$bootstrap_script"
          chmod a+r "$REMOTE_ARCHIVE"

          bootstrap_command=(
            env
            "DEPLOY_TARGET_DIR=$DEPLOY_TARGET_DIR"
            "RELEASE_SHA=$RELEASE_SHA"
            "REMOTE_ARCHIVE=$REMOTE_ARCHIVE"
            "SERVICE_USER=$SERVICE_USER"
            "SERVICE_GROUP=$SERVICE_GROUP"
            bash "$bootstrap_script"
          )

          if [[ "$(id -un)" = "$SERVICE_USER" ]]; then
            "${bootstrap_command[@]}"
          else
            sudo -n -u "$SERVICE_USER" -H "${bootstrap_command[@]}"
          fi
          EOF

          remote_command=$(
            printf \
              'RELEASE_SHA=%q REMOTE_ARCHIVE=%q DEPLOY_TARGET_DIR=%q SERVICE_USER=%q SERVICE_GROUP=%q bash -s' \
              "$RELEASE_SHA" \
              "$REMOTE_ARCHIVE" \
              "$DEPLOY_TARGET_DIR" \
              "$service_user" \
              "$service_group"
          )

          timeout "$SSH_EXECUTION_TIMEOUT_SECONDS" \
            ssh -F "${{ steps.ssh.outputs.config }}" nome-production "$remote_command" \
            < "$RUNNER_TEMP/remote-deploy.sh"

name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy from main history
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: nome-deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Validate release revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The selected revision is not in main history." >&2
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DEPLOY_S3_BUCKET: ${{ vars.DEPLOY_S3_BUCKET }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          DEPLOY_TARGET_DIR: ${{ vars.DEPLOY_TARGET_DIR }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${AWS_DEPLOY_ROLE_ARN:?Set the AWS_DEPLOY_ROLE_ARN repository variable}"
          : "${DEPLOY_S3_BUCKET:?Set the DEPLOY_S3_BUCKET repository variable}"
          : "${DEPLOY_INSTANCE_ID:?Set the DEPLOY_INSTANCE_ID repository variable}"
          : "${DEPLOY_TARGET_DIR:?Set the DEPLOY_TARGET_DIR repository variable}"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "archive=$RUNNER_TEMP/nome-release.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output "${{ steps.release.outputs.archive }}" HEAD

      - name: Upload release artifact
        id: artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          key="releases/${RELEASE_SHA}.tar.gz"
          aws s3 cp "${{ steps.release.outputs.archive }}" "s3://${{ vars.DEPLOY_S3_BUCKET }}/${key}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "url=$(aws s3 presign "s3://${{ vars.DEPLOY_S3_BUCKET }}/${key}" --expires-in 3600)" >> "$GITHUB_OUTPUT"

      - name: Send production deploy command
        id: ssm
        shell: bash
        env:
          DEPLOY_TARGET_DIR: ${{ vars.DEPLOY_TARGET_DIR }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_URL: ${{ steps.artifact.outputs.url }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/remote-deploy.sh" <<'EOF'
          set -euo pipefail

          tmp_dir="/tmp/nome-deploy-${RELEASE_SHA}"
          archive_path="${tmp_dir}/release.tar.gz"

          rm -rf "$tmp_dir"
          mkdir -p "$tmp_dir"
          trap 'rm -rf "$tmp_dir"' EXIT

          ARCHIVE_PATH="$archive_path" RELEASE_URL="$RELEASE_URL" python3 - <<'PY'
          import os
          import urllib.request

          urllib.request.urlretrieve(os.environ["RELEASE_URL"], os.environ["ARCHIVE_PATH"])
          PY

          tar -xzf "$archive_path" -C "$tmp_dir"
          chmod +x "$tmp_dir/scripts/deploy_release.sh"

          sudo -u ubuntu -H env \
            TARGET_DIR="$DEPLOY_TARGET_DIR" \
            RELEASE_SHA="$RELEASE_SHA" \
            RELEASE_SOURCE_DIR="$tmp_dir" \
            bash "$tmp_dir/scripts/deploy_release.sh"
          EOF

          remote_script_b64=$(base64 < "$RUNNER_TEMP/remote-deploy.sh" | tr -d '\n')

          jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --arg release_url "$RELEASE_URL" \
            --arg target_dir "$DEPLOY_TARGET_DIR" \
            --arg remote_script_b64 "$remote_script_b64" \
            '{
              commands: [
                ("export RELEASE_SHA=" + ($release_sha | @sh)),
                ("export RELEASE_URL=" + ($release_url | @sh)),
                ("export DEPLOY_TARGET_DIR=" + ($target_dir | @sh)),
                ("printf %s " + ($remote_script_b64 | @sh) + " | base64 -d > /tmp/run-nome-deploy.sh"),
                "bash /tmp/run-nome-deploy.sh"
              ]
            }' > "$RUNNER_TEMP/ssm-params.json"

          command_id=$(
            aws ssm send-command \
              --instance-ids "$DEPLOY_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Nome ${RELEASE_SHA}" \
              --parameters "file://$RUNNER_TEMP/ssm-params.json" \
              --timeout-seconds 1800 \
              --query "Command.CommandId" \
              --output text
          )

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy completion
        shell: bash
        env:
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          for _ in {1..80}; do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$DEPLOY_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || true)

            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$DEPLOY_INSTANCE_ID" --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 15
                ;;
              *)
                echo "Deploy failed with status: $status"
                echo "--- stdout ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$DEPLOY_INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$DEPLOY_INSTANCE_ID" --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
            esac
          done

          echo "Deploy timed out waiting for SSM command completion."
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$DEPLOY_INSTANCE_ID" --query 'StandardOutputContent' --output text || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$DEPLOY_INSTANCE_ID" --query 'StandardErrorContent' --output text || true
          exit 1

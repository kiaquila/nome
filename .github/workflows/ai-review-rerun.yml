name: AI Review Rerun

on:
  workflow_run:
    workflows: [AI Review]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  ai-review-rerun:
    name: ai-review-rerun
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        (
          github.event.workflow_run.path == '.github/workflows/ai-review.yml' ||
          startsWith(github.event.workflow_run.path, '.github/workflows/ai-review.yml@')
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.type == 'Bot'
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'Bot' &&
        (
          startsWith(github.event.comment.body, 'Codex Review:') ||
          contains(github.event.comment.body, '<!-- codex-review-receipt:') ||
          contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->') ||
          contains(github.event.comment.body, '<!-- codex-review-state:') ||
          contains(github.event.comment.body, 'AI_REVIEW_OUTCOME:')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-review-requeue-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout trusted rerun scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rerun AI Review for trusted evidence
        run: node scripts/ai-review-rerun.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
